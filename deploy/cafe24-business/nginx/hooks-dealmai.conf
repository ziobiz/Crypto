# hooks.dealmai.com — HTTP (ACME + redirect). CURFEX webhook public hostname.
server {
    listen 80;
    server_name hooks.dealmai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
